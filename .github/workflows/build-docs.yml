# Deployment occurs on push/merge to main with gh-pages.yml
name: Build Docs

on:
  push:
    branches: [dev, main]
    paths: [docs/**]
  pull_request:
    branches: [dev, main]
    paths: [docs/**]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
